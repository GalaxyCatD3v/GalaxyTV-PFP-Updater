<div id="GalaxyTVPfpConfigPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="GalaxyTVPfpConfigForm">
                <div class="inputContainer">
                    <input is="emby-input" type="text" id="ApiUrl" label="API URL Template:" />
                    <div class="fieldDescription">
                        URL template to fetch profile pictures. Use {0} as placeholder for the username.
                    </div>
                </div>

                <div class="paperList label-default" style="padding: 1em; margin-bottom: 1.5em;">
                    <h3 style="margin-top: 0;">Manual Trigger</h3>
                    <p>Run the avatar synchronization task immediately across all users.</p>
                    <button is="emby-button" type="button" id="btnRunNow" class="raised button-accent">
                        <span>Run Now</span>
                    </button>
                    <span id="taskStatus" style="margin-left: 1em;"></span>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Save Configuration</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        var GalaxyTVPfpConfig = {
            pluginId: '8f3e2a1b-4c5d-6e7f-8a9b-0c1d2e3f4a5b',
            taskKey: 'UserProfilePictureUpdaterTask'
        };

        document.querySelector('#GalaxyTVPfpConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            var page = this;

            ApiClient.getPluginConfiguration(GalaxyTVPfpConfig.pluginId).then(function (config) {
                document.querySelector('#ApiUrl').value = config.ApiUrl || '';
                Dashboard.hideLoadingMsg();
            });

            document.querySelector('#btnRunNow').addEventListener('click', function () {
                var statusElem = document.querySelector('#taskStatus');
                statusElem.textContent = 'Triggering task...';

                ApiClient.getScheduledTasks().then(function (tasks) {
                    var task = tasks.find(function (t) { return t.Key === GalaxyTVPfpConfig.taskKey; });
                    if (!task) {
                        statusElem.textContent = 'Task not found.';
                        return;
                    }
                    ApiClient.startScheduledTask(task.Id).then(function () {
                        statusElem.textContent = 'Task triggered successfully!';
                    }).catch(function (err) {
                        statusElem.textContent = 'Failed to trigger task: ' + err;
                    });
                });
            });

            document.querySelector('#GalaxyTVPfpConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();

                ApiClient.getPluginConfiguration(GalaxyTVPfpConfig.pluginId).then(function (config) {
                    config.ApiUrl = document.querySelector('#ApiUrl').value;

                    ApiClient.updatePluginConfiguration(GalaxyTVPfpConfig.pluginId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
            });
        });
    </script>
</div>
