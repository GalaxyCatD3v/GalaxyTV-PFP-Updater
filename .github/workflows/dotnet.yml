name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore GalaxyLabs.JellyFin.Plugin.GalaxyTV-PFP-Updater.sln
    - name: Build
      run: dotnet build GalaxyLabs.JellyFin.Plugin.GalaxyTV-PFP-Updater.sln --no-restore -c Release
    - name: Upload plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: plugin-dll
        path: bin/Release/net10.0/GalaxyLabs.JellyFin.Plugin.GalaxyTV_PFP_Updater.dll
